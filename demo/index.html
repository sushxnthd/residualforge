<!doctype html><meta charset="utf-8"><title>ResidualForge Lab</title><style>body{margin:0;background:#071018;color:#d9f6ff;font:14px ui-monospace,monospace}.wrap{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:28px;border-right:1px solid #1c4150;background:#09151f}h1{font-size:22px}label{display:block;margin:22px 0 8px;color:#8fcde0}input{width:100%}.main{padding:34px}.grid{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;max-width:820px}.cell{aspect-ratio:1;border-radius:2px;background:#123}.stat{display:inline-block;margin:20px 20px 0 0;padding:14px;border:1px solid #1c4150}.hot{outline:2px solid #fff}</style><div class=wrap><div class=side><h1>ResidualForge</h1><p>PDE residual scanner</p><label>defect strength <b id=v>0.12</b></label><input id=s type=range min=0 max=30 value=12><label>diffusivity</label><input type=range min=5 max=40 value=20><p>Heat equation / interior stencil</p></div><div class=main><h2>Residual heatmap</h2><div id=g class=grid></div><div class=stat>RMSE <b id=r></b></div><div class=stat>hotspot <b id=h></b></div></div></div><script>const g=document.querySelector('#g'),s=document.querySelector('#s');function draw(){g.innerHTML='';let q=+s.value/100,max=0,mi=0;for(let i=0;i<180;i++){let x=i%18,y=Math.floor(i/18),d=Math.exp(-((x-9)**2+(y-5)**2)/7)*q+Math.random()*.005;max=Math.max(max,d);if(d===max)mi=i;let c=document.createElement('div');c.className='cell';c.style.background=`rgb(${15+Math.min(220,d*1200)},${35+Math.min(110,d*500)},${48+Math.min(80,d*200)})`;g.append(c)}g.children[mi].classList.add('hot');v.textContent=q.toFixed(2);r.textContent=(.00019+q*.31).toFixed(4);h.textContent=`t${Math.floor(mi/18)}, x${mi%18}`};s.oninput=draw;draw()</script>
