[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "residualforge"
version = "0.1.0"
description = "Finite-difference PDE residual auditing for scientific surrogate trajectories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "sushanth"}]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/sushxnthd/residualforge"
Demo = "https://sushxnthd.github.io/residualforge/"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
residualforge = "residualforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
